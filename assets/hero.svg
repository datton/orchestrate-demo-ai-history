<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Eight decades of AI as one glowing path</title><desc id="d">A glowing curve runs left to right through four stages: a vacuum tube, a punched card, a microchip and a many-layered neural network, with stars in the background.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150d2e"/><stop offset=".6" stop-color="#2a1466"/><stop offset="1" stop-color="#4a1d8f"/></linearGradient>
<linearGradient id="path" x1="0" x2="1"><stop offset="0" stop-color="#ffc857"/><stop offset=".5" stop-color="#ff9ec7"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffc857" stop-opacity=".55"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></radialGradient>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<g fill="#fbf9f4" opacity=".7"><circle cx="60" cy="50" r="1.6"/><circle cx="170" cy="90" r="1.2"/><circle cx="330" cy="40" r="1.8"/><circle cx="470" cy="70" r="1.2"/><circle cx="620" cy="35" r="1.6"/><circle cx="780" cy="80" r="1.2"/><circle cx="900" cy="45" r="1.8"/><circle cx="250" cy="380" r="1.4"/><circle cx="560" cy="395" r="1.6"/><circle cx="850" cy="370" r="1.2"/></g>
<path d="M30 330C170 330 190 240 280 240S400 320 500 290 640 160 740 170 860 130 930 90" fill="none" stroke="url(#path)" stroke-width="5" stroke-linecap="round"/>
<path d="M30 330C170 330 190 240 280 240S400 320 500 290 640 160 740 170 860 130 930 90" fill="none" stroke="#ffc857" stroke-width="14" stroke-linecap="round" opacity=".12"/>
<!-- 1 vacuum tube -->
<g transform="translate(110 150)"><circle cx="40" cy="60" r="70" fill="url(#glow)"/><path d="M15 50a25 32 0 0 1 50 0v52H15z" fill="#2a1466" stroke="#fbf9f4" stroke-width="4"/><path d="M30 98V60m20 38V60M30 60q10-18 20 0" fill="none" stroke="#ffc857" stroke-width="3" stroke-linecap="round"/><rect x="8" y="102" width="64" height="16" rx="4" fill="#fbf9f4"/></g>
<!-- 2 punched card -->
<g transform="translate(250 70) rotate(-8)"><rect width="110" height="70" rx="6" fill="#fbf9f4"/><path d="M0 0h20l-20 20z" fill="#2a1466"/><g fill="#5a2bd6"><rect x="18" y="20" width="7" height="12" rx="1"/><rect x="34" y="20" width="7" height="12" rx="1"/><rect x="58" y="20" width="7" height="12" rx="1"/><rect x="82" y="20" width="7" height="12" rx="1"/><rect x="26" y="42" width="7" height="12" rx="1"/><rect x="50" y="42" width="7" height="12" rx="1"/><rect x="66" y="42" width="7" height="12" rx="1"/><rect x="90" y="42" width="7" height="12" rx="1"/></g></g>
<!-- 3 microchip -->
<g transform="translate(450 190)"><g stroke="#b9a4ff" stroke-width="4" stroke-linecap="round"><path d="M14 -10v14M34 -10v14M54 -10v14M14 74v14M34 74v14M54 74v14M-10 14h14M-10 34h14M-10 54h14M74 14h14M74 34h14M74 54h14"/></g><rect x="4" y="4" width="70" height="70" rx="8" fill="#fbf9f4"/><rect x="20" y="20" width="38" height="38" rx="4" fill="#5a2bd6"/><circle cx="39" cy="39" r="8" fill="#ffc857"/></g>
<!-- 4 neural network -->
<g transform="translate(650 40)"><g stroke="#b9a4ff" stroke-width="1.8" opacity=".7" fill="none"><path d="M20 40 100 20M20 40 100 80M20 40 100 140M20 110 100 20M20 110 100 80M20 110 100 140M20 180 100 80M20 180 100 140M100 20 180 60M100 80 180 60M100 80 180 130M100 140 180 130M100 140 180 190M180 60 250 95M180 130 250 95M180 130 250 160M180 190 250 160"/></g><g fill="#ff9ec7"><circle cx="20" cy="40" r="9"/><circle cx="20" cy="110" r="9"/><circle cx="20" cy="180" r="9"/></g><g fill="#b9a4ff"><circle cx="100" cy="20" r="10"/><circle cx="100" cy="80" r="10"/><circle cx="100" cy="140" r="10"/><circle cx="180" cy="60" r="10"/><circle cx="180" cy="130" r="10"/><circle cx="180" cy="190" r="10"/></g><g fill="#ffc857"><circle cx="250" cy="95" r="13"/><circle cx="250" cy="160" r="13"/></g></g>
</svg>
